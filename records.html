---
layout: default
title: Records
permalink: /records/
---
<section class="block">
  <h1>Swung Out Records</h1>
  <div class="grid three">
    {% for r in site.data.releases %}
    <figure>
      <a href="{{ r.link }}"><img src="{{ r.art | replace: '_10.jpg', '_16.jpg' }}" alt="{{ r.artist }} – {{ r.title }} artwork" loading="lazy"></a>
      <figcaption><span class="eyebrow">{{ r.date | date: "%Y" }}{% if r.cat %} · {{ r.cat }}{% endif %}</span><strong>{{ r.artist }}</strong> {{ r.title }}</figcaption>
    </figure>
    {% endfor %}
  </div>
</section>
